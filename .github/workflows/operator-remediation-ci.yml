name: Operator Remediation CI

on:
  push:
    branches:
      - fix/operator-real-engine-wiring
  pull_request:
    branches:
      - cursor/production-readiness-audit-ea01

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, bcmath, pdo_sqlite
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Run PHPUnit
        id: phpunit
        shell: bash
        run: |
          set -o pipefail
          env -u DB_DATABASE -u DB_CONNECTION -u APP_ENV php artisan test --compact 2>&1 | tee phpunit-output.log

      - name: Upload PHPUnit output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phpunit-output
          path: phpunit-output.log
          if-no-files-found: error
