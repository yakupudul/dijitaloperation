name: DOP Next Task

on:
  workflow_dispatch:
  pull_request:
    types: [closed]
    branches: [main]

concurrency:
  group: dop-next-task
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  gate:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.decide.outputs.should_run }}
      skip_reason: ${{ steps.decide.outputs.skip_reason }}
    steps:
      - name: Decide whether to start a product task
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "skip_reason=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          branch="$(echo "${PR_BRANCH:-}" | tr '[:upper:]' '[:lower:]')"
          title="$(echo "${PR_TITLE:-}" | tr '[:upper:]' '[:lower:]')"

          skip=false
          reason=""
          case "$branch" in
            chore/*|automation/*|docs/*)
              skip=true
              reason="Merged branch prefix is excluded from next-task automation ($branch)"
              ;;
          esac

          case "$title" in
            chore:*|docs:*|ci:*)
              skip=true
              reason="Merged PR title indicates maintenance/docs/ci work"
              ;;
          esac

          if [ "$skip" = true ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "skip_reason=$reason" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "skip_reason=" >> "$GITHUB_OUTPUT"
          fi

  next-task:
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install OpenAI SDK + run unit tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r .automation/requirements.txt
          python -m unittest discover -s .automation/tests -v

      - name: Run Architect
        id: architect
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_ARCHITECT_MODEL: ${{ vars.OPENAI_ARCHITECT_MODEL }}
        run: |
          set -euo pipefail
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "::error::OPENAI_API_KEY secret is required"
            exit 1
          fi
          MODEL_ARGS=()
          if [ -n "${OPENAI_ARCHITECT_MODEL:-}" ]; then
            MODEL_ARGS=(--model "$OPENAI_ARCHITECT_MODEL")
          fi
          python .automation/architect.py --output /tmp/dop-task.json "${MODEL_ARGS[@]}"
          python .automation/architect.py --validate-only /tmp/dop-task.json
          STATUS="$(python -c 'import json; print(json.load(open("/tmp/dop-task.json"))["status"])')"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          python -c 'import json; from pathlib import Path; d=json.loads(Path("/tmp/dop-task.json").read_text()); Path("/tmp/dop-architect-summary.md").write_text("## DOP Architect\n- status: `"+d.get("status","")+"`\n- task_id: `"+str(d.get("task_id",""))+"`\n- title: "+str(d.get("title",""))+"\n- reason: "+str(d.get("reason",""))+"\n")'
          cat /tmp/dop-architect-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Stop if not TASK_READY
        if: steps.architect.outputs.status != 'TASK_READY'
        run: |
          echo "Architect status is ${{ steps.architect.outputs.status }}; stopping without implementation."
          exit 0

      - name: Prepare implementer prompt
        if: steps.architect.outputs.status == 'TASK_READY'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          task = json.loads(Path("/tmp/dop-task.json").read_text())
          implementer = Path(".automation/prompts/implementer.md").read_text()
          prompt = f"""{implementer}

          ## Architect task (authoritative for this run)
          ```json
          {json.dumps(task, ensure_ascii=False, indent=2)}
          ```

          IMPORTANT:
          - Do NOT create branches, commit, push, or open PRs.
          - Do NOT touch secrets or .env files.
          - Follow MASTER_SPEC / AGENTS.md.
          - Run the tests listed in tests_required when possible.
          """
          Path("/tmp/dop-implementer-prompt.txt").write_text(prompt)
          PY

      - name: Install Cursor CLI
        if: steps.architect.outputs.status == 'TASK_READY'
        run: |
          set -euo pipefail
          curl https://cursor.com/install -fsS | bash
          echo "$HOME/.cursor/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run Cursor implementer
        if: steps.architect.outputs.status == 'TASK_READY'
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          CURSOR_AGENT_MODEL: ${{ vars.CURSOR_AGENT_MODEL }}
        run: |
          set -euo pipefail
          if [ -z "${CURSOR_API_KEY:-}" ]; then
            echo "::error::CURSOR_API_KEY secret is required"
            exit 1
          fi
          AGENT_BIN=""
          if command -v agent >/dev/null 2>&1; then
            AGENT_BIN="agent"
          elif command -v cursor-agent >/dev/null 2>&1; then
            AGENT_BIN="cursor-agent"
          else
            echo "::error::Cursor CLI agent binary not found after install"
            exit 1
          fi
          MODEL_ARGS=()
          if [ -n "${CURSOR_AGENT_MODEL:-}" ]; then
            MODEL_ARGS=(--model "$CURSOR_AGENT_MODEL")
          fi
          "$AGENT_BIN" -p --force --output-format text "${MODEL_ARGS[@]}" "$(cat /tmp/dop-implementer-prompt.txt)"

      - name: Ensure changes exist
        if: steps.architect.outputs.status == 'TASK_READY'
        id: changes
        run: |
          set -euo pipefail
          if git status --porcelain | grep -q .; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "::error::Cursor produced no file changes"
            exit 1
          fi

      - name: Block secret-like files
        if: steps.architect.outputs.status == 'TASK_READY'
        run: |
          python - <<'PY'
          import subprocess
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path(".automation").resolve()))
          from common import find_secret_like_paths
          out = subprocess.check_output(["git", "status", "--porcelain"], text=True)
          paths = []
          for line in out.splitlines():
              if not line.strip():
                  continue
              path = line[3:].strip()
              if " -> " in path:
                  path = path.split(" -> ", 1)[1]
              paths.append(path)
          hits = find_secret_like_paths(paths)
          if hits:
              print("Secret-like paths detected:", ", ".join(hits))
              raise SystemExit(1)
          print("No secret-like paths detected")
          PY

      - name: Run required tests
        if: steps.architect.outputs.status == 'TASK_READY'
        id: tests
        run: |
          set -euo pipefail
          {
            echo "## Test notes"
            if [ -f composer.json ]; then
              if command -v php >/dev/null 2>&1; then
                php -v | head -1
              else
                sudo apt-get update
                sudo apt-get install -y php-cli php-sqlite3 php-mbstring php-xml php-curl unzip
              fi
              if [ ! -d vendor ]; then
                curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
                composer install --no-interaction --prefer-dist
              fi
              php artisan test | tee /tmp/dop-test-output.txt
            else
              echo "No composer.json; skipped Laravel tests" | tee /tmp/dop-test-output.txt
            fi
            python -m unittest discover -s .automation/tests -v | tee -a /tmp/dop-test-output.txt
          } 2>&1

      - name: Validate branch name and create PR
        if: steps.architect.outputs.status == 'TASK_READY'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path(".automation").resolve()))
          from common import is_safe_branch_name, AUTOMATION_PR_MARKER
          task = json.loads(Path("/tmp/dop-task.json").read_text())
          branch = task["branch_name"]
          if not is_safe_branch_name(branch):
              raise SystemExit(f"Unsafe branch_name from architect: {branch}")
          Path("/tmp/dop-branch.txt").write_text(branch)
          body = f"""{AUTOMATION_PR_MARKER}

          ## Automated DOP task

          - **task_id:** `{task.get('task_id','')}`
          - **title:** {task.get('title','')}

          ### Objective
          {task.get('objective','')}

          ### Acceptance criteria
          """
          for item in task.get("acceptance_criteria") or []:
              body += f"- {item}\n"
          body += "\n### Tests required\n"
          for item in task.get("tests_required") or []:
              body += f"- {item}\n"
          body += "\n### Must not do\n"
          for item in task.get("must_not_do") or []:
              body += f"- {item}\n"
          body += "\n### Architect reason\n"
          body += f"{task.get('reason','')}\n"
          Path("/tmp/dop-pr-body.md").write_text(body)
          Path("/tmp/dop-pr-title.txt").write_text(task.get("title") or task.get("task_id") or "DOP automated task")
          PY

          BRANCH="$(cat /tmp/dop-branch.txt)"
          TITLE="$(cat /tmp/dop-pr-title.txt)"

          git config user.name "dop-automation"
          git config user.email "dop-automation@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add -A
          # Re-check secrets after staging
          python - <<'PY'
          import subprocess, sys
          from pathlib import Path
          sys.path.insert(0, str(Path(".automation").resolve()))
          from common import find_secret_like_paths
          files = subprocess.check_output(["git", "diff", "--cached", "--name-only"], text=True).splitlines()
          hits = find_secret_like_paths(files)
          if hits:
              raise SystemExit("Refusing to commit secret-like files: " + ", ".join(hits))
          PY
          git commit -m "$(python - <<'PY'
          import json
          from pathlib import Path
          task = json.loads(Path("/tmp/dop-task.json").read_text())
          print(f"feat: {task.get('title') or task.get('task_id')}")
          PY
          )"
          git push -u origin "$BRANCH"

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "$TITLE" \
            --body-file /tmp/dop-pr-body.md

  skipped:
    needs: gate
    if: needs.gate.outputs.should_run != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Explain skip
        run: |
          echo "## DOP Next Task skipped" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ needs.gate.outputs.skip_reason }}" >> "$GITHUB_STEP_SUMMARY"
