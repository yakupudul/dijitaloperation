# RETIRED — Legacy DOP Autopilot orchestration (v1).
#
# Autopilot v2: Cursor Automations choose/implement/repair work.
# GitHub Actions PR gate: .github/workflows/dop-pr-gate.yml
#
# This stub is intentionally workflow_dispatch-only so repository_dispatch
# (dop-next-task / dop-recover-task) cannot auto-run product orchestration.
# Full archived workflow: .automation/legacy/workflows/dop-autopilot.yml

name: DOP Autopilot (legacy retired)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Refuse legacy orchestration
        run: |
          set -euo pipefail
          {
            echo "# Legacy DOP Autopilot retired"
            echo ""
            echo "This workflow no longer runs Architect / Implementer / recovery loops."
            echo "Use Cursor Automations + \`.github/workflows/dop-pr-gate.yml\`."
            echo ""
            echo "Archived copy: \`.automation/legacy/workflows/dop-autopilot.yml\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::Legacy DOP Autopilot is retired. Use Cursor Automations + dop-pr-gate.yml"
          exit 1
