name: DOP Autopilot

# Canonical product development loop. One Architect task per run.
# Continuation: repository_dispatch event_type=dop-next-task after successful auto-merge.
# Self-healing: repository_dispatch event_type=dop-recover-task resumes a failed task
# without selecting a new Architect task (unless the failure was pre-task Architect).

on:
  workflow_dispatch:
  repository_dispatch:
    types: [dop-next-task, dop-recover-task]

concurrency:
  group: dop-autopilot
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  autopilot:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, xml, curl, sqlite3, zip, bcmath
          coverage: none

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Composer dependencies
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if composer install --no-interaction --prefer-dist; then
              exit 0
            fi
            echo "composer install failed (attempt $attempt); retrying..."
            sleep $((attempt * 5))
          done
          exit 1

      - name: Install automation Python deps + unit tests
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if python -m pip install --upgrade pip \
              && python -m pip install -r .automation/requirements.txt; then
              break
            fi
            echo "pip install failed (attempt $attempt); retrying..."
            sleep $((attempt * 5))
            if [ "$attempt" -eq 3 ]; then exit 1; fi
          done
          python -m unittest discover -s .automation/tests -v

      - name: Prepare runtime dir
        run: |
          mkdir -p .automation/runtime
          echo ".automation/runtime/" >> .git/info/exclude || true

      - name: Resolve run mode
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          CLIENT_PAYLOAD: ${{ toJson(github.event.client_payload) }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, sys, subprocess
          from pathlib import Path
          sys.path.insert(0, '.automation')
          from recovery import (
              parse_recovery_client_payload,
              recovery_should_run_architect,
              should_ignore_stale_recovery,
              format_run_summary_markdown,
              HARD_BLOCKED,
              write_run_summary_status,
          )
          from common import extract_task_ids_from_pr_bodies
          event_name = os.environ.get('EVENT_NAME', '')
          action = os.environ.get('EVENT_ACTION', '')
          raw = os.environ.get('CLIENT_PAYLOAD') or '{}'
          try:
              payload_raw = json.loads(raw)
          except json.JSONDecodeError:
              payload_raw = {}
          mode = 'next'
          if event_name == 'repository_dispatch' and action == 'dop-recover-task':
              mode = 'recover'
          payload = parse_recovery_client_payload(payload_raw if mode == 'recover' else {})
          Path('.automation/runtime/recover_payload.json').write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          Path('.automation/runtime/retry_counts.json').write_text(
              json.dumps(payload.get('retry_counts') or {}, indent=2) + '\n', encoding='utf-8'
          )
          ignore = 'false'
          run_architect = 'true'
          if mode == 'recover':
              merged_ids, merged_branches, open_branches = set(), set(), set()
              try:
                  out = subprocess.check_output(
                      ['gh', 'pr', 'list', '--state', 'merged', '--base', 'main', '--limit', '50', '--json', 'body,headRefName'],
                      text=True,
                  )
                  rows = json.loads(out)
                  merged_ids = extract_task_ids_from_pr_bodies([str(r.get('body') or '') for r in rows])
                  merged_branches = {str(r.get('headRefName') or '') for r in rows}
              except Exception:
                  pass
              try:
                  out = subprocess.check_output(
                      ['gh', 'pr', 'list', '--state', 'open', '--base', 'main', '--limit', '30', '--json', 'headRefName'],
                      text=True,
                  )
                  open_branches = {str(r.get('headRefName') or '') for r in json.loads(out)}
              except Exception:
                  pass
              if should_ignore_stale_recovery(
                  task_id=payload.get('original_task_id', ''),
                  branch=payload.get('original_branch', ''),
                  merged_task_ids=merged_ids,
                  merged_branches=merged_branches,
                  open_pr_branches=open_branches,
              ):
                  ignore = 'true'
                  write_run_summary_status(
                      Path('.automation/runtime/chain_status.txt'),
                      HARD_BLOCKED,
                      'stale recover ignored (task already merged)',
                  )
                  with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as sf:
                      sf.write(format_run_summary_markdown(
                          HARD_BLOCKED, detail='stale recover ignored (task already merged)'
                      ))
              run_architect = 'true' if recovery_should_run_architect(
                  payload, open_pr_branches=open_branches
              ) else 'false'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as fh:
              fh.write(f'mode={mode}\n')
              fh.write(f'ignore_stale={ignore}\n')
              fh.write(f'run_architect={run_architect}\n')
          print(f'mode={mode} ignore_stale={ignore} run_architect={run_architect}')
          PY

      - name: Stop on stale recovery
        if: steps.mode.outputs.ignore_stale == 'true'
        run: |
          echo "Stale dop-recover-task ignored (task already merged)." >> "$GITHUB_STEP_SUMMARY"

      - name: Restore recovered task context
        id: restore
        if: steps.mode.outputs.mode == 'recover' && steps.mode.outputs.ignore_stale != 'true' && steps.mode.outputs.run_architect == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          payload = json.loads(Path('.automation/runtime/recover_payload.json').read_text())
          branch = payload.get('original_branch') or ''
          task_id = payload.get('original_task_id') or ''
          pr_number = payload.get('pr_number') or ''
          if not branch:
              raise SystemExit('recover payload missing original_branch')
          Path('.automation/runtime/branch.txt').write_text(branch)
          task = None
          try:
              target = str(pr_number) if pr_number else branch
              body = subprocess.check_output(['gh', 'pr', 'view', target, '--json', 'body', '-q', '.body'], text=True)
              if not pr_number:
                  pr_number = subprocess.check_output(['gh', 'pr', 'view', branch, '--json', 'number', '-q', '.number'], text=True).strip()
              marker = '```json'
              if marker in body and '"task_id"' in body:
                  chunk = body.split(marker, 1)[1].split('```', 1)[0]
                  task = json.loads(chunk)
          except Exception as exc:
              print('warn: could not restore task from PR body:', exc)
          if not isinstance(task, dict):
              raise SystemExit('Unable to restore Architect task JSON from PR for recover resume')
          Path('.automation/runtime/task.json').write_text(json.dumps(task, indent=2) + '\n')
          if pr_number:
              Path('.automation/runtime/pr_number.txt').write_text(str(pr_number).strip())
          print('Restored recover context', task.get('task_id'), branch, pr_number)
          PY
          echo "status=TASK_READY" >> "$GITHUB_OUTPUT"
          BRANCH="$(cat .automation/runtime/branch.txt)"
          git fetch origin "$BRANCH"
          git checkout --force -B "$BRANCH" "origin/$BRANCH"
          echo "Recover resume on $BRANCH @ $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"

      - name: Run Architect
        id: architect
        if: steps.mode.outputs.ignore_stale != 'true' && (steps.mode.outputs.mode != 'recover' || steps.mode.outputs.run_architect == 'true')
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_ARCHITECT_MODEL: ${{ vars.OPENAI_ARCHITECT_MODEL }}
          OPENAI_REASONING_EFFORT: ${{ vars.OPENAI_REASONING_EFFORT }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "::error::OPENAI_API_KEY missing"
            echo "OPENAI_API_KEY missing" > .automation/runtime/last_failure.txt
            echo "architect" > .automation/runtime/failed_step.txt
            exit 1
          fi
          MODEL_ARGS=()
          if [ -n "${OPENAI_ARCHITECT_MODEL:-}" ]; then MODEL_ARGS=(--model "$OPENAI_ARCHITECT_MODEL"); fi
          set +e
          python .automation/architect.py --output .automation/runtime/task.json "${MODEL_ARGS[@]}" 2> >(tee .automation/runtime/last_failure.txt >&2)
          arch_rc=$?
          set -e
          if [ "$arch_rc" -ne 0 ]; then
            echo "architect" > .automation/runtime/failed_step.txt
            exit "$arch_rc"
          fi
          python .automation/architect.py --validate-only .automation/runtime/task.json --require-product-specs
          STATUS="$(python -c 'import json;print(json.load(open(".automation/runtime/task.json"))["status"])')"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          python -c 'import json;from pathlib import Path;d=json.loads(Path(".automation/runtime/task.json").read_text());print("## Architect\n- status:",d["status"],"\n- title:",d.get("title",""),"\n- reason:",d.get("reason",""))' >> "$GITHUB_STEP_SUMMARY"
          if [ -f .automation/runtime/usage.jsonl ]; then
            echo "## OpenAI usage" >> "$GITHUB_STEP_SUMMARY"
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          for line in Path('.automation/runtime/usage.jsonl').read_text().splitlines():
              if not line.strip():
                  continue
              row=json.loads(line)
              print(f"- **{row.get('role')}** model=`{row.get('model')}` input={row.get('input_tokens')} cached={row.get('cached_input_tokens')} output={row.get('output_tokens')}")
          PY
          fi

      - name: Mark recover status when Architect skipped
        id: architect_skip
        if: steps.mode.outputs.ignore_stale != 'true' && steps.mode.outputs.mode == 'recover' && steps.mode.outputs.run_architect == 'false'
        run: echo "status=TASK_READY" >> "$GITHUB_OUTPUT"

      - name: Handle ROADMAP_COMPLETE
        if: (steps.architect.outputs.status || steps.architect_skip.outputs.status) == 'ROADMAP_COMPLETE'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          echo "Roadmap complete. No dispatch." >> "$GITHUB_STEP_SUMMARY"
          python .automation/scripts/update_project_status.py \
            --overall ROADMAP_COMPLETE \
            --run-outcome ROADMAP_COMPLETE \
            --commit-main || true

      - name: Handle HUMAN_REQUIRED hard blocker
        if: (steps.architect.outputs.status || steps.architect_skip.outputs.status) == 'HUMAN_REQUIRED'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          import sys
          sys.path.insert(0,'.automation')
          from common import format_hard_blocker_issue_body, should_create_hard_blocker_issue
          task=json.loads(Path('.automation/runtime/task.json').read_text())
          reason=str(task.get('reason') or 'Human required')
          if should_create_hard_blocker_issue('HUMAN_REQUIRED', reason):
              body=format_hard_blocker_issue_body(reason=reason, task=task)
              Path('.automation/runtime/blocker.md').write_text(body)
          PY
          if [ -f .automation/runtime/blocker.md ]; then
            gh issue create --title "DOP hard blocker: Architect HUMAN_REQUIRED" --body-file .automation/runtime/blocker.md || true
          fi
          echo "Hard blocker — no merge/dispatch" >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Sync workspace to origin/main
        if: (steps.architect.outputs.status || steps.architect_skip.outputs.status) == 'TASK_READY' && steps.mode.outputs.run_architect != 'false'
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout --force -B main origin/main
          git reset --hard origin/main
          git clean -fd -e .automation/runtime -e .env
          echo "Implementer base: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare implementer prompt
        if: (steps.architect.outputs.status || steps.architect_skip.outputs.status) == 'TASK_READY' && steps.mode.outputs.run_architect != 'false'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          task=json.loads(Path('.automation/runtime/task.json').read_text())
          implementer=Path('.automation/prompts/implementer.md').read_text()
          specs='\n'.join(f'- {p}' for p in task.get('product_spec_paths') or [])
          Path('.automation/runtime/implementer_prompt.txt').write_text(f"""{implementer}

          ## Architect task JSON
          ```json
          {json.dumps(task, ensure_ascii=False, indent=2)}
          ```

          ## product_spec_paths (MUST READ)
          {specs}

          Do NOT git push / PR / merge. Do NOT touch secrets/.env.
          Do NOT modify `.github/` or `.automation/` unless the Architect task files_or_areas explicitly requires it.
          """)
          PY

      - name: Install Cursor CLI
        if: (steps.architect.outputs.status || steps.architect_skip.outputs.status) == 'TASK_READY'
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if curl https://cursor.com/install -fsS | bash; then
              break
            fi
            echo "Cursor CLI install failed (attempt $attempt)"
            sleep $((attempt * 5))
            if [ "$attempt" -eq 3 ]; then
              echo "cursor_cli_install" > .automation/runtime/failed_step.txt
              exit 1
            fi
          done
          echo "$HOME/.cursor/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run Cursor implementer
        if: (steps.architect.outputs.status || steps.architect_skip.outputs.status) == 'TASK_READY' && steps.mode.outputs.run_architect != 'false'
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          CURSOR_AGENT_MODEL: ${{ vars.CURSOR_AGENT_MODEL }}
        run: |
          set -euo pipefail
          if [ -z "${CURSOR_API_KEY:-}" ]; then echo "::error::CURSOR_API_KEY missing"; exit 1; fi
          if command -v agent >/dev/null 2>&1; then AGENT_BIN=agent
          elif command -v cursor-agent >/dev/null 2>&1; then AGENT_BIN=cursor-agent
          else echo "::error::Cursor agent binary missing"; exit 1; fi
          MODEL_ARGS=()
          if [ -n "${CURSOR_AGENT_MODEL:-}" ]; then MODEL_ARGS=(--model "$CURSOR_AGENT_MODEL"); fi
          "$AGENT_BIN" -p --force --output-format text "${MODEL_ARGS[@]}" "$(cat .automation/runtime/implementer_prompt.txt)"

      - name: Reject empty diff
        if: (steps.architect.outputs.status || steps.architect_skip.outputs.status) == 'TASK_READY' && steps.mode.outputs.run_architect != 'false'
        run: |
          if ! git status --porcelain | grep -q .; then
            echo "::error::Empty implementation diff"
            exit 1
          fi
          git status --short | tee .automation/runtime/changed_files.txt
          git diff --stat | tee .automation/runtime/diff_stat.txt

      - name: Initial quality gates
        if: (steps.architect.outputs.status || steps.architect_skip.outputs.status) == 'TASK_READY'
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          CURSOR_AGENT_MODEL: ${{ vars.CURSOR_AGENT_MODEL }}
          MAX_IMPLEMENTATION_FIX: "3"
        run: |
          set -euo pipefail
          if ! bash .automation/scripts/quality_gates_with_fix.sh .automation/runtime/test_notes.txt 2> >(tee -a .automation/runtime/last_failure.txt >&2); then
            echo "initial_quality_gates" > .automation/runtime/failed_step.txt
            exit 1
          fi

      - name: Create PR
        if: (steps.architect.outputs.status || steps.architect_skip.outputs.status) == 'TASK_READY' && steps.mode.outputs.run_architect != 'false'
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          trap 'echo create_pr > .automation/runtime/failed_step.txt; echo "Create PR failed" >> .automation/runtime/last_failure.txt' ERR
          python - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0,'.automation')
          from common import AUTOMATION_PR_MARKER, is_safe_branch_name
          task=json.loads(Path('.automation/runtime/task.json').read_text())
          branch=task['branch_name']
          if not is_safe_branch_name(branch):
              raise SystemExit(f'Unsafe branch: {branch}')
          Path('.automation/runtime/branch.txt').write_text(branch)
          body=f"""{AUTOMATION_PR_MARKER}

          ## Automated DOP Autopilot task

          - **task_id:** `{task.get('task_id','')}`
          - **title:** {task.get('title','')}
          - **branch:** `{branch}`

          ### Objective
          {task.get('objective','')}

          ### Product specs
          """
          for p in task.get('product_spec_paths') or []:
              body += f"- `{p}`\n"
          body += "\n### Acceptance criteria\n"
          for p in task.get('acceptance_criteria') or []:
              body += f"- {p}\n"
          body += "\n### Tests required\n"
          for p in task.get('tests_required') or []:
              body += f"- {p}\n"
          body += "\n<details><summary>Architect task JSON</summary>\n\n```json\n"
          body += json.dumps(task, ensure_ascii=False, indent=2)
          body += "\n```\n</details>\n"
          Path('.automation/runtime/pr_body.md').write_text(body)
          Path('.automation/runtime/pr_title.txt').write_text(task.get('title') or task.get('task_id') or 'DOP autopilot task')
          PY
          BRANCH="$(cat .automation/runtime/branch.txt)"
          TITLE="$(cat .automation/runtime/pr_title.txt)"
          git config user.name "dop-automation"
          git config user.email "dop-automation@users.noreply.github.com"
          bash .automation/scripts/prepare_product_branch.sh "$BRANCH" .automation/runtime/task.json
          git commit -m "feat: $(cat .automation/runtime/pr_title.txt | tr -d '\n')"
          bash .automation/scripts/assert_product_branch_infra.sh .automation/runtime/task.json
          echo "merge-base=$(git merge-base HEAD origin/main)" >> "$GITHUB_STEP_SUMMARY"
          echo "base-sha=$(cat .automation/runtime/base_sha.txt)" >> "$GITHUB_STEP_SUMMARY"
          git push -u origin "$BRANCH"
          URL="$(gh pr create --base main --head "$BRANCH" --title "$TITLE" --body-file .automation/runtime/pr_body.md)"
          echo "pr_url=$URL" >> "$GITHUB_OUTPUT"
          gh pr view --json number,mergeable -q .number > .automation/runtime/pr_number.txt
          echo "PR $URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Ensure PR context on recover resume
        if: (steps.architect.outputs.status || steps.architect_skip.outputs.status) == 'TASK_READY' && steps.mode.outputs.mode == 'recover' && steps.mode.outputs.run_architect == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BRANCH="$(cat .automation/runtime/branch.txt)"
          if [ ! -f .automation/runtime/pr_number.txt ] || [ ! -s .automation/runtime/pr_number.txt ]; then
            gh pr view "$BRANCH" --json number -q .number > .automation/runtime/pr_number.txt
          fi
          if [ ! -f .automation/runtime/pr_body.md ]; then
            gh pr view "$(cat .automation/runtime/pr_number.txt)" --json body -q .body > .automation/runtime/pr_body.md
          fi
          if [ ! -f .automation/runtime/pr_title.txt ]; then
            gh pr view "$(cat .automation/runtime/pr_number.txt)" --json title -q .title > .automation/runtime/pr_title.txt
          fi
          git config user.name "dop-automation"
          git config user.email "dop-automation@users.noreply.github.com"
          echo "Recovering PR #$(cat .automation/runtime/pr_number.txt)" >> "$GITHUB_STEP_SUMMARY"

      - name: Review and fix loop
        if: (steps.architect.outputs.status || steps.architect_skip.outputs.status) == 'TASK_READY'
        id: reviewloop
        env:
          GH_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_REVIEWER_MODEL: ${{ vars.OPENAI_REVIEWER_MODEL }}
          OPENAI_ESCALATION_MODEL: ${{ vars.OPENAI_ESCALATION_MODEL }}
          OPENAI_REASONING_EFFORT: ${{ vars.OPENAI_REASONING_EFFORT }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          CURSOR_AGENT_MODEL: ${{ vars.CURSOR_AGENT_MODEL }}
        run: |
          set -euo pipefail
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "::error::OPENAI_API_KEY missing — cannot review or merge"
            echo "OPENAI_API_KEY missing" > .automation/runtime/last_failure.txt
            echo "review" > .automation/runtime/failed_step.txt
            exit 1
          fi
          PR_NUMBER="$(cat .automation/runtime/pr_number.txt)"
          FINAL=HUMAN_REQUIRED
          FIX_REQUIRED_COUNT=0
          ESCALATION_USED=0
          : > .automation/runtime/previous_issues.txt
          rm -f .automation/runtime/review_evidence.json
          for round in 1 2 3 4; do
            git fetch origin main
            git diff --name-only origin/main...HEAD > .automation/runtime/pr_files.txt
            git diff origin/main...HEAD > .automation/runtime/pr.diff
            git log origin/main..HEAD --pretty=%s > .automation/runtime/pr_commits.txt
            HEAD_SHA="$(git rev-parse HEAD)"
            echo "$HEAD_SHA" > .automation/runtime/reviewed_head_sha.txt
            MODEL_ARGS=()
            if [ -n "${OPENAI_REVIEWER_MODEL:-}" ]; then MODEL_ARGS=(--model "$OPENAI_REVIEWER_MODEL"); fi
            PREV_ARGS=()
            if [ -s .automation/runtime/previous_issues.txt ]; then
              PREV_ARGS=(--previous-issues-file .automation/runtime/previous_issues.txt)
            fi
            REVIEW_OK=0
            : > .automation/runtime/reviewer_attempt.txt
            for rev_try in 1 2 3; do
              set +e
              python .automation/reviewer.py \
                --require-automation-marker \
                --title "$(cat .automation/runtime/pr_title.txt)" \
                --body-file .automation/runtime/pr_body.md \
                --diff-file .automation/runtime/pr.diff \
                --files-file .automation/runtime/pr_files.txt \
                --test-notes-file .automation/runtime/test_notes.txt \
                --task-file .automation/runtime/task.json \
                --head-sha "$HEAD_SHA" \
                --evidence-output .automation/runtime/review_evidence.json \
                --output .automation/runtime/review.json \
                --comment-output .automation/runtime/review_comment.md \
                "${PREV_ARGS[@]}" \
                "${MODEL_ARGS[@]}" 2> >(tee .automation/runtime/reviewer_attempt.txt >&2)
              rev_rc=$?
              set -e
              cat .automation/runtime/reviewer_attempt.txt >> .automation/runtime/last_failure.txt || true
              if [ "$rev_rc" -eq 0 ] && [ -f .automation/runtime/review.json ]; then
                REVIEW_OK=1
                break
              fi
              echo "Reviewer attempt $rev_try failed (rc=$rev_rc)" >> "$GITHUB_STEP_SUMMARY"
              if grep -Eiq 'invalid.?api.?key|unauthorized|billing|insufficient.?quota|OPENAI_API_KEY missing|401|402' .automation/runtime/reviewer_attempt.txt; then
                echo "review" > .automation/runtime/failed_step.txt
                exit 1
              fi
              if grep -Eiq 'invalid json|JSONDecodeError|failed validation' .automation/runtime/reviewer_attempt.txt && [ "$rev_try" -ge 2 ]; then
                break
              fi
              sleep $((rev_try * 5))
            done
            if [ "$REVIEW_OK" -ne 1 ] || [ ! -f .automation/runtime/review.json ]; then
              echo "::error::Reviewer JSON missing or reviewer unavailable after retries"
              echo "review" > .automation/runtime/failed_step.txt
              exit 1
            fi
            VERDICT="$(python -c 'import json;print(json.load(open(".automation/runtime/review.json"))["verdict"])')"
            if [ -z "$VERDICT" ]; then
              echo "::error::Reviewer verdict missing"
              exit 1
            fi
            echo "Round $round => $VERDICT (sha=$HEAD_SHA)" >> "$GITHUB_STEP_SUMMARY"

            if [ "$VERDICT" = "FIX_REQUIRED" ]; then
              FIX_REQUIRED_COUNT=$((FIX_REQUIRED_COUNT + 1))
            fi
            if [ "$ESCALATION_USED" -eq 0 ] && { [ "$VERDICT" = "HUMAN_REQUIRED" ] || [ "$FIX_REQUIRED_COUNT" -ge 2 ]; }; then
              ESCALATION_USED=1
              echo "Escalation review triggered ($VERDICT, fix_required=$FIX_REQUIRED_COUNT)" >> "$GITHUB_STEP_SUMMARY"
              python .automation/reviewer.py \
                --escalate \
                --require-automation-marker \
                --title "$(cat .automation/runtime/pr_title.txt)" \
                --body-file .automation/runtime/pr_body.md \
                --diff-file .automation/runtime/pr.diff \
                --files-file .automation/runtime/pr_files.txt \
                --test-notes-file .automation/runtime/test_notes.txt \
                --task-file .automation/runtime/task.json \
                --previous-issues-file .automation/runtime/previous_issues.txt \
                --head-sha "$HEAD_SHA" \
                --evidence-output .automation/runtime/review_evidence.json \
                --output .automation/runtime/review.json \
                --comment-output .automation/runtime/review_comment.md
              VERDICT="$(python -c 'import json;print(json.load(open(".automation/runtime/review.json"))["verdict"])')"
              echo "Escalation => $VERDICT" >> "$GITHUB_STEP_SUMMARY"
            fi

            # Comment is best-effort; merge requires runtime evidence, not the comment.
            gh pr comment "$PR_NUMBER" --body-file .automation/runtime/review_comment.md \
              || echo "::warning::PR review comment failed; continuing with runtime evidence only"
            if [ -f .automation/runtime/usage.jsonl ]; then
              echo "### OpenAI usage (after review round $round)" >> "$GITHUB_STEP_SUMMARY"
              python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          for line in Path('.automation/runtime/usage.jsonl').read_text().splitlines():
              if not line.strip():
                  continue
              row=json.loads(line)
              print(f"- **{row.get('role')}** model=`{row.get('model')}` input={row.get('input_tokens')} cached={row.get('cached_input_tokens')} output={row.get('output_tokens')}")
          PY
            fi
            if [ "$VERDICT" = "APPROVED" ]; then
              python - <<'PY'
          import json, subprocess, sys
          from pathlib import Path
          sys.path.insert(0, '.automation')
          from common import load_review_evidence, validate_review_evidence
          task = json.loads(Path('.automation/runtime/task.json').read_text())
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          evidence = load_review_evidence(Path('.automation/runtime/review_evidence.json'))
          errors = validate_review_evidence(
              evidence,
              current_head_sha=head,
              expected_task_id=str(task.get('task_id') or '') or None,
          )
          if errors:
              raise SystemExit('Approved evidence invalid: ' + '; '.join(errors))
          print('Review evidence OK for', head)
          PY
              FINAL=APPROVED
              break
            fi
            if [ "$VERDICT" = "HUMAN_REQUIRED" ]; then FINAL=HUMAN_REQUIRED; break; fi
            # New commits invalidate prior approval evidence.
            rm -f .automation/runtime/review_evidence.json
            python - <<'PY'
          import json
          from pathlib import Path
          review=json.loads(Path('.automation/runtime/review.json').read_text())
          lines=[]
          for issue in review.get('issues') or []:
              lines.append(f"- [{issue.get('severity')}] {issue.get('file')}: {issue.get('problem')} => {issue.get('required_fix')}")
          Path('.automation/runtime/previous_issues.txt').write_text('\n'.join(lines) or '(none)')
          PY
            USED="$(python -c "import sys; from pathlib import Path; sys.path.insert(0,'.automation'); from common import count_fix_attempts_from_commit_messages; msgs=[l.strip() for l in Path('.automation/runtime/pr_commits.txt').read_text().splitlines() if l.strip()]; print(count_fix_attempts_from_commit_messages(msgs))")"
            if [ "$USED" -ge 3 ]; then
              python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,'.automation')
          from common import format_hard_blocker_issue_body
          Path('.automation/runtime/blocker.md').write_text(format_hard_blocker_issue_body(reason='Max automated fixes (3) exhausted', task={}))
          PY
              gh issue create --title "DOP hard blocker: max fixes exhausted on PR #$PR_NUMBER" --body-file .automation/runtime/blocker.md || true
              FINAL=HUMAN_REQUIRED
              break
            fi
            python - <<'PY'
          import json
          from pathlib import Path
          review=json.loads(Path('.automation/runtime/review.json').read_text())
          fixer=Path('.automation/prompts/fixer.md').read_text()
          task=Path('.automation/runtime/task.json').read_text()
          Path('.automation/runtime/fixer_prompt.txt').write_text(f"""{fixer}

          ## Architect task
          ```json
          {task}
          ```

          ## Reviewer JSON
          ```json
          {json.dumps(review, ensure_ascii=False, indent=2)}
          ```
          Do NOT git push/PR. Fix only listed issues.
          """)
          PY
            if command -v agent >/dev/null 2>&1; then AGENT_BIN=agent
            elif command -v cursor-agent >/dev/null 2>&1; then AGENT_BIN=cursor-agent
            else exit 1; fi
            MODEL_ARGS=()
            if [ -n "${CURSOR_AGENT_MODEL:-}" ]; then MODEL_ARGS=(--model "$CURSOR_AGENT_MODEL"); fi
            "$AGENT_BIN" -p --force --output-format text "${MODEL_ARGS[@]}" "$(cat .automation/runtime/fixer_prompt.txt)"
            bash .automation/scripts/quality_gates_with_fix.sh | tee .automation/runtime/test_notes.txt
            if git status --porcelain | grep -q .; then
              git add -A
              git reset -q .automation/runtime 2>/dev/null || true
              # Re-base fix commits onto latest origin/main if main advanced.
              git fetch origin main
              if ! git merge-base --is-ancestor origin/main HEAD; then
                git stash push --include-untracked --message "dop-fix" || true
                git rebase origin/main
                git stash pop || true
              fi
              git commit -m "fix: address automated DOP review" || true
              bash .automation/scripts/assert_product_branch_infra.sh .automation/runtime/task.json
              git push origin HEAD:"$(cat .automation/runtime/branch.txt)"
            fi
          done
          echo "verdict=$FINAL" >> "$GITHUB_OUTPUT"
          if [ "$FINAL" != "APPROVED" ]; then
            echo "::error::Stopped with $FINAL"
            echo "review_loop_$FINAL" > .automation/runtime/failed_step.txt
            exit 1
          fi
          if [ ! -f .automation/runtime/review_evidence.json ]; then
            echo "::error::APPROVED without review evidence — refuse merge"
            echo "review_evidence_missing" > .automation/runtime/failed_step.txt
            exit 1
          fi

      - name: Final merge gates + squash merge + dispatch
        if: (steps.architect.outputs.status || steps.architect_skip.outputs.status) == 'TASK_READY' && steps.reviewloop.outputs.verdict == 'APPROVED'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash .automation/scripts/quality_gates.sh
          PR_NUMBER="$(cat .automation/runtime/pr_number.txt)"
          CURRENT_HEAD="$(git rev-parse HEAD)"
          python - <<'PY'
          import json, subprocess, sys
          from pathlib import Path
          sys.path.insert(0,'.automation')
          from common import (
            final_merge_gate_errors, find_secret_like_paths, diff_is_suspiciously_large,
            scan_diff_for_credential_leaks, dispatch_eligible, load_review_evidence,
          )
          task=json.loads(Path('.automation/runtime/task.json').read_text())
          branch=Path('.automation/runtime/branch.txt').read_text().strip()
          body=Path('.automation/runtime/pr_body.md').read_text()
          files=Path('.automation/runtime/pr_files.txt').read_text().splitlines()
          diff=Path('.automation/runtime/pr.diff').read_text()
          secrets=find_secret_like_paths(files)
          if scan_diff_for_credential_leaks(diff):
              secrets.append('(diff credential pattern)')
          mergeable=True
          try:
              out=subprocess.check_output(['gh','pr','view',str(Path('.automation/runtime/pr_number.txt').read_text().strip()),'--json','mergeable','-q','.mergeable'], text=True).strip()
              mergeable = out.upper() in {'MERGEABLE','UNKNOWN',''} or out.lower()=='mergeable'
          except Exception:
              mergeable=True
          current_head=subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip()
          # Prefer remote PR head if available so local/runtime drift cannot bypass SHA lock.
          try:
              remote_head=subprocess.check_output(
                  ['gh','pr','view',str(Path('.automation/runtime/pr_number.txt').read_text().strip()),'--json','headRefOid','-q','.headRefOid'],
                  text=True,
              ).strip().lower()
              if remote_head and remote_head != current_head.lower():
                  raise SystemExit(
                      f'Local HEAD {current_head} != PR head {remote_head}; refuse merge'
                  )
          except subprocess.CalledProcessError:
              pass
          evidence=load_review_evidence(Path('.automation/runtime/review_evidence.json'))
          errors=final_merge_gate_errors(
            branch_name=branch,
            pr_body=body,
            task=task,
            secret_paths=secrets,
            suspicious_diff=diff_is_suspiciously_large(diff),
            tests_passed=True,
            mergeable=mergeable,
            repo_root=Path('.').resolve(),
            review_evidence=evidence,
            current_head_sha=current_head,
            require_review_approval=True,
          )
          if errors:
              raise SystemExit('Final merge gate failed: '+'; '.join(errors))
          if evidence and evidence.get('verdict') != 'APPROVED':
              raise SystemExit('Refuse merge: reviewer evidence verdict is not APPROVED')
          if not dispatch_eligible(merged=False, automation_pr=True, verdict_approved=True, hard_blocker=False, roadmap_complete=False):
              pass
          print('Final merge gate OK with verified reviewer APPROVED for', current_head)
          PY
          gh pr merge "$PR_NUMBER" --squash --delete-branch
          echo "Merged #$PR_NUMBER" >> "$GITHUB_STEP_SUMMARY"
          gh api "repos/${{ github.repository }}/dispatches" -f event_type='dop-next-task'
          echo "Dispatched dop-next-task" >> "$GITHUB_STEP_SUMMARY"
          # Status commit only — must NOT dispatch again
          DOP_RUN_OUTCOME=COMPLETED_AND_CONTINUING \
            python .automation/scripts/update_project_status.py \
              --overall RUNNING \
              --run-outcome COMPLETED_AND_CONTINUING \
              --commit-main \
              --close-stale || true

      - name: Self-healing supervisor
        if: failure() && steps.mode.outputs.ignore_stale != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          STEP="$(cat .automation/runtime/failed_step.txt 2>/dev/null || echo unknown)"
          python .automation/scripts/recover_supervisor.py \
            --step-name "$STEP" \
            --stage "$STEP" \
            --error-file .automation/runtime/last_failure.txt \
            --repo "${{ github.repository }}" \
            --run-id "${{ github.run_id }}" || true
          OUTCOME=RECOVERING
          if [ -f .automation/runtime/chain_status.txt ] && grep -q HARD_BLOCKED .automation/runtime/chain_status.txt; then
            OUTCOME=HARD_BLOCKED
          fi
          python .automation/scripts/update_project_status.py \
            --overall "$OUTCOME" \
            --run-outcome "$OUTCOME" \
            --commit-main || true

      - name: Project status summary (always)
        if: always() && steps.mode.outputs.ignore_stale != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f .automation/runtime/project_status_summary.md ]; then
            cat .automation/runtime/project_status_summary.md >> "$GITHUB_STEP_SUMMARY" || true
          elif [ -f docs/PROJECT_STATUS.md ]; then
            echo "## docs/PROJECT_STATUS.md (checkout copy)" >> "$GITHUB_STEP_SUMMARY"
            head -n 40 docs/PROJECT_STATUS.md >> "$GITHUB_STEP_SUMMARY" || true
          fi
