name: MoxDOP CI

# Full PHPUnit suite on every push to the working branch: once on SQLite (:memory:, as phpunit.xml sets)
# and once on PostgreSQL 16 (the production database). PostgreSQL-only tests self-skip on SQLite.
# Read-only: no deploy, no merge, no provider credentials.

on:
  push:
    branches:
      - chatgpt/search-demand-foundation
  workflow_dispatch:

concurrency:
  group: moxdop-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sqlite:
    name: PHPUnit (SQLite)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, xml, curl, sqlite3, zip, bcmath, intl
          coverage: none

      - name: Composer cache
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install Composer dependencies
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if composer install --no-interaction --prefer-dist --no-progress; then
              exit 0
            fi
            echo "composer install failed (attempt $attempt); retrying..."
            sleep $((attempt * 5))
          done
          exit 1

      - name: Bootstrap test env
        run: bash .automation/scripts/bootstrap_test_env.sh

      - name: PHPUnit
        run: php -d memory_limit=4G vendor/bin/phpunit

  postgres:
    name: PHPUnit (PostgreSQL 16)
    runs-on: ubuntu-latest
    # Known PostgreSQL-only failures (one-way compact-fact migration vs. old rollback tests, tests leaking rows
    # without RefreshDatabase, SQLite-only backup tests) are tracked in PRODUCT_CAPABILITY_LEDGER.md. The job
    # reports them without blocking; SQLite stays the gate. Remove this line once the list is empty.
    continue-on-error: true
    timeout-minutes: 75
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: moxdop
          POSTGRES_PASSWORD: moxdop
          POSTGRES_DB: moxdop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U moxdop -d moxdop_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: moxdop_test
      DB_USERNAME: moxdop
      DB_PASSWORD: moxdop
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, xml, curl, sqlite3, zip, bcmath, intl, pgsql, pdo_pgsql
          coverage: none

      - name: Composer cache
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install Composer dependencies
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if composer install --no-interaction --prefer-dist --no-progress; then
              exit 0
            fi
            echo "composer install failed (attempt $attempt); retrying..."
            sleep $((attempt * 5))
          done
          exit 1

      - name: Bootstrap test env
        run: bash .automation/scripts/bootstrap_test_env.sh

      # DB_* above are real environment variables, so phpunit.xml's force="false" defaults do not replace them.
      - name: PHPUnit
        run: php -d memory_limit=4G vendor/bin/phpunit
