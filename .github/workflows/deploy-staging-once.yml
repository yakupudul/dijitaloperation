name: One-time staging deploy

on:
  push:
    branches:
      - cursor/claude-audit-track-a-503a
    paths:
      - .github/workflows/deploy-staging-once.yml
  pull_request:
    branches:
      - cursor/release-candidate-integration-a7bb
    paths:
      - .github/workflows/deploy-staging-once.yml

permissions:
  contents: read

concurrency:
  group: moxdop-staging-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to app.moximu.com
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      STAGING_HOST: app.moximu.com
      STAGING_USER: root
      STAGING_APP_ROOT: /var/www/moxdop-staging
      EXPECTED_HOST_FINGERPRINT: SHA256:YaT8OMcPSbsrMBS7ZmYdg+BGUFwLVZ0B9TVqHttcttE
    steps:
      - name: Prepare SSH
        shell: bash
        env:
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${STAGING_SSH_PRIVATE_KEY:-}" ]; then
            echo "::error::Missing GitHub Actions secret STAGING_SSH_PRIVATE_KEY"
            exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_PRIVATE_KEY" > ~/.ssh/moxdop_staging
          chmod 600 ~/.ssh/moxdop_staging
          ssh-keyscan -t ecdsa "$STAGING_HOST" > ~/.ssh/known_hosts 2>/dev/null
          actual="$(ssh-keygen -lf ~/.ssh/known_hosts -E sha256 | awk '{print $2}' | head -n1)"
          if [ "$actual" != "$EXPECTED_HOST_FINGERPRINT" ]; then
            echo "::error::Staging SSH host fingerprint mismatch"
            exit 1
          fi

      - name: Validate existing staging host
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/moxdop_staging -o BatchMode=yes -o StrictHostKeyChecking=yes "$STAGING_USER@$STAGING_HOST" "
            set -euo pipefail
            APP='$STAGING_APP_ROOT'
            test -d \"\$APP/.git\" || { echo 'Expected existing staging git checkout not found'; exit 21; }
            test -f \"\$APP/.env\" || { echo 'Existing staging .env not found'; exit 22; }
            cd \"\$APP\"
            APP_ENV_VALUE=\$(grep -E '^APP_ENV=' .env | tail -n1 | cut -d= -f2- | tr -d '\"\047[:space:]')
            DB_CONNECTION_VALUE=\$(grep -E '^DB_CONNECTION=' .env | tail -n1 | cut -d= -f2- | tr -d '\"\047[:space:]')
            APP_DEBUG_VALUE=\$(grep -E '^APP_DEBUG=' .env | tail -n1 | cut -d= -f2- | tr -d '\"\047[:space:]')
            test \"\$APP_ENV_VALUE\" = staging || { echo 'Refusing deploy: APP_ENV is not staging'; exit 23; }
            test \"\$DB_CONNECTION_VALUE\" = pgsql || { echo 'Refusing deploy: DB_CONNECTION is not pgsql'; exit 24; }
            test \"\$APP_DEBUG_VALUE\" != true || { echo 'Refusing deploy: APP_DEBUG=true'; exit 25; }
            echo 'Existing staging host validated.'
          "

      - name: Deploy exact GitHub SHA
        shell: bash
        env:
          RELEASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/moxdop_staging -o BatchMode=yes -o StrictHostKeyChecking=yes "$STAGING_USER@$STAGING_HOST" "
            set -euo pipefail
            APP='$STAGING_APP_ROOT'
            RELEASE_SHA='$RELEASE_SHA'
            cd \"\$APP\"

            git fetch origin --prune
            git cat-file -e \"\$RELEASE_SHA^{commit}\"

            echo 'Taking pre-deploy staging backup...'
            export PGHOST=\$(php -r '\$e=parse_ini_file(".env"); echo \$e["DB_HOST"] ?? "127.0.0.1";')
            export PGPORT=\$(php -r '\$e=parse_ini_file(".env"); echo \$e["DB_PORT"] ?? "5432";')
            export PGUSER=\$(php -r '\$e=parse_ini_file(".env"); echo \$e["DB_USERNAME"] ?? "";')
            export PGDATABASE=\$(php -r '\$e=parse_ini_file(".env"); echo \$e["DB_DATABASE"] ?? "";')
            export PGPASSWORD=\$(php -r '\$e=parse_ini_file(".env"); echo \$e["DB_PASSWORD"] ?? "";')
            export MOXDOP_BACKUP_DIR=/var/backups/moxdop
            export MOXDOP_APP_ROOT=\"\$APP\"
            umask 077
            bash ops/backup.sh
            unset PGPASSWORD

            git checkout --detach \"\$RELEASE_SHA\"
            bash deploy/staging/deploy.sh

            ACTUAL_SHA=\$(git rev-parse HEAD)
            test \"\$ACTUAL_SHA\" = \"\$RELEASE_SHA\" || { echo 'Deployed SHA mismatch'; exit 31; }
            echo \"DEPLOYED_SHA=\$ACTUAL_SHA\"
          "

      - name: Public staging smoke
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 https://app.moximu.com/up >/dev/null
          curl --fail --silent --show-error --max-time 20 https://app.moximu.com/up/liveness >/dev/null
          curl --fail --silent --show-error --max-time 20 https://app.moximu.com/up/readiness >/dev/null
          curl --fail --silent --show-error --max-time 20 https://app.moximu.com/login >/dev/null
          echo 'STAGING DEPLOYED — READY FOR MANUAL UAT'
